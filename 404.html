<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan | MATHDOSMAN</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            color: #1e293b;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 1.5rem;
        }
        .error-card {
            max-width: 480px;
            background: #ffffff;
            border-radius: 1.25rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .error-code {
            font-size: 4.5rem;
            font-weight: 800;
            color: #2563eb;
            line-height: 1;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">404</div>
        <h1 class="h4 fw-bold mb-2">Halaman Tidak Ditemukan</h1>
        <p class="text-secondary small mb-4">Halaman yang Anda tuju mungkin sudah dipindahkan, dihapus, atau tautan yang dimasukkan salah.</p>
        <a href="/" class="btn btn-primary px-4 py-2 rounded-pill fw-semibold d-inline-flex align-items-center gap-2">
            <i class="ti ti-home"></i> Kembali ke Beranda
        </a>
    </div>
</body>
</html>
