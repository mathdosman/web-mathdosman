<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Midnight Sapphire Space -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060c1d"/>
      <stop offset="45%" stop-color="#0a193c"/>
      <stop offset="100%" stop-color="#030611"/>
    </linearGradient>

    <!-- Luxury Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Left Pillar Gradient: Pure Cyan to Deep Royal -->
    <linearGradient id="stemLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right Pillar Gradient: Azure to Deep Cobalt -->
    <linearGradient id="stemRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Left Diagonal Chevron: Radiant Ice-Cyan to Blue -->
    <linearGradient id="diagLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Right Diagonal Chevron: Vibrant Sky to Indigo -->
    <linearGradient id="diagRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Delta Prism (Pure White to Electric Cyan) -->
    <linearGradient id="deltaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Function Curve / Orbit Arc -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Ambient Core Radial Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#060c1d" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Shadow -->
    <filter id="mShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Core Neon Glow -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle Card Container (Exclusive App Badge) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" stroke="url(#rimGrad)" stroke-width="4"/>

  <!-- 2. Ambient Mathematical Glow -->
  <circle cx="256" cy="256" r="170" fill="url(#auraGlow)"/>

  <!-- 3. Mathematical Coordinate & Orbit Accents -->
  <circle cx="256" cy="256" r="185" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.18"/>
  <circle cx="256" cy="256" r="125" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.12"/>
  <line x1="256" y1="48" x2="256" y2="68" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4"/>
  <line x1="256" y1="444" x2="256" y2="464" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4"/>
  <line x1="48" y1="256" x2="68" y2="256" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4"/>
  <line x1="444" y1="256" x2="464" y2="256" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- 4. Dynamic Calculus / Orbit Curve f(x) -->
  <path d="M 86 328 C 128 412, 238 426, 332 366 C 412 312, 436 192, 396 132" 
        stroke="url(#orbitGrad)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.65" stroke-dasharray="8 6"/>

  <!-- 5. Mathematical Monogram "M" (Geometric Precision) -->
  <g filter="url(#mShadow)">
    <!-- Left Vertical Pillar with Dynamic 20° Chamfered Top -->
    <path d="M 104 376 L 104 162 L 162 136 L 162 376 C 162 383, 156 388, 149 388 L 117 388 C 110 388, 104 383, 104 376 Z" 
          fill="url(#stemLeft)"/>

    <!-- Right Vertical Pillar with Dynamic 20° Chamfered Top -->
    <path d="M 350 136 L 408 162 L 408 376 C 408 383, 402 388, 395 388 L 363 388 C 356 388, 350 383, 350 376 Z" 
          fill="url(#stemRight)"/>

    <!-- Left Diagonal Chevron -->
    <polygon points="162,136 256,330 256,216 162,188" 
             fill="url(#diagLeft)"/>

    <!-- Right Diagonal Chevron -->
    <polygon points="350,136 350,188 256,216 256,330" 
             fill="url(#diagRight)"/>

    <!-- Mathematical Knowledge Apex: Floating Delta Prism -->
    <g filter="url(#coreGlow)">
      <polygon points="256,114 294,196 218,196" fill="url(#deltaGrad)"/>
      <!-- Inner Delta Void -->
      <polygon points="256,142 282,188 230,188" fill="#081432"/>
    </g>

    <!-- Convergence Nexus Diamond -->
    <polygon points="256,316 272,342 256,366 240,342" fill="#38bdf8"/>
  </g>

  <!-- 6. Innovation Spark Star Accent -->
  <g transform="translate(382, 112)" filter="url(#coreGlow)">
    <path d="M 0 -15 Q 0 0 15 0 Q 0 0 0 15 Q 0 0 -15 0 Q 0 0 0 -15 Z" fill="#ffffff"/>
  </g>
</svg>
