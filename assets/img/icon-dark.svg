<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Terang (Mode Gelap) -->
    <linearGradient id="lightBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <!-- Bangun 1: Pilar Kiri Gelap 3D -->
    <linearGradient id="darkLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#061224"/>
    </linearGradient>

    <!-- Bangun 2: Lipatan Diagonal Atas 3D -->
    <linearGradient id="darkTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="60%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bangun 3: Pilar Kanan & Puncak Gelap 3D -->
    <linearGradient id="darkRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="foldShadowDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Terang Rounded -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#lightBg)"/>
  <rect x="6" y="6" width="500" height="500" rx="90" stroke="#bfdbfe" stroke-width="2"/>

  <!-- Lingkaran Tipis di Belakang M -->
  <circle cx="256" cy="252" r="204" stroke="#1e3a8a" stroke-width="10" stroke-opacity="0.85"/>

  <!-- Bangun 1: Pilar Kiri -->
  <rect x="74" y="182" width="110" height="228" fill="url(#darkLeft)"/>
  <polygon points="74,182 184,182 184,224 74,194" fill="url(#foldShadowDark)"/>

  <!-- Bangun 3: Pilar Kanan & Puncak 45° (Rapi sejajar y=410) -->
  <polygon points="338,182 446,74 446,410 338,410" fill="url(#darkRight)"/>

  <!-- Bangun 2: Bidang Lipatan Diagonal Atas -->
  <polygon points="74,74 230,74 338,182 260,260" fill="url(#darkTop)"/>
  <polyline points="74,74 230,74 338,182" stroke="#60a5fa" stroke-width="2" stroke-opacity="0.85" fill="none"/>
</svg>
