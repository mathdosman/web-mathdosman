<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-trig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="55%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#bg-trig)"/>
  <!-- Sumbu Gelombang -->
  <line x1="20" y1="88" x2="380" y2="88" stroke="rgba(255,255,255,0.22)" stroke-width="1.2"/>
  <!-- Gelombang Sinus -->
  <path d="M 30 88 C 65 25, 100 25, 135 88 C 170 151, 205 151, 240 88 C 275 25, 310 25, 345 88" fill="none" stroke="#a5b4fc" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Gelombang Cosinus -->
  <path d="M 30 35 C 65 35, 100 141, 135 141 C 170 141, 205 35, 240 35 C 275 35, 310 141, 345 141" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- Segitiga Siku-Siku & Sudut -->
  <polygon points="270,135 365,135 365,65" fill="rgba(255,255,255,0.12)" stroke="#fde047" stroke-width="2.5"/>
  <rect x="353" y="123" width="12" height="12" fill="none" stroke="#fde047" stroke-width="1.5"/>
  <path d="M 295 135 A 25 25 0 0 0 288 121" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="300" y="128" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#fff">θ</text>
  <text x="24" y="142" font-family="Georgia, serif" font-style="italic" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.9)">sin²θ + cos²θ = 1</text>
</svg>
