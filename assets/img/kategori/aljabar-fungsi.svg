<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-alj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <pattern id="grid-alj" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="180" fill="url(#bg-alj)"/>
  <rect width="400" height="180" fill="url(#grid-alj)"/>
  <!-- Sumbu Koordinat -->
  <line x1="120" y1="95" x2="380" y2="95" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
  <line x1="250" y1="15" x2="250" y2="165" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>
  <!-- Kurva Parabola Kuadrat -->
  <path d="M 155 25 Q 250 185 345 25" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Garis Linear Pemotong -->
  <line x1="140" y1="130" x2="365" y2="40" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- Titik Potong & Puncak -->
  <circle cx="250" cy="105" r="5" fill="#f43f5e" stroke="#fff" stroke-width="1.5"/>
  <circle cx="192" cy="108" r="4.5" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
  <circle cx="318" cy="59" r="4.5" fill="#fbbf24" stroke="#fff" stroke-width="1.5"/>
  <!-- Notasi Matematika Dekoratif -->
  <text x="24" y="138" font-family="Georgia, serif" font-style="italic" font-size="22" font-weight="bold" fill="rgba(255,255,255,0.85)">f(x) = ax² + bx + c</text>
  <text x="24" y="90" font-family="monospace" font-size="13" fill="rgba(147,197,253,0.75)">x₁,₂ = (-b ± √D) / 2a</text>
</svg>
