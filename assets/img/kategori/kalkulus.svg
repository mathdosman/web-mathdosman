<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-kalk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="55%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="area-kalk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(216, 180, 254, 0.45)"/>
      <stop offset="100%" stop-color="rgba(216, 180, 254, 0.02)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="180" fill="url(#bg-kalk)"/>
  <!-- Sumbu & Kurva Integral -->
  <line x1="145" y1="145" x2="375" y2="145" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="160" y1="20" x2="160" y2="155" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Area Terarsir di Bawah Kurva -->
  <path d="M 190 145 L 190 110 C 235 45, 290 130, 345 38 L 345 145 Z" fill="url(#area-kalk)"/>
  <!-- Kurva Fungsi f(x) -->
  <path d="M 165 130 C 225 30, 285 140, 365 25" fill="none" stroke="#e9d5ff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Garis Singgung Turunan dy/dx -->
  <line x1="190" y1="125" x2="275" y2="48" stroke="#fde047" stroke-width="2" stroke-dasharray="5 3"/>
  <circle cx="233" cy="86" r="5" fill="#f43f5e" stroke="#fff" stroke-width="1.5"/>
  <!-- Simbol Integral & Limit -->
  <text x="26" y="102" font-family="Georgia, serif" font-style="italic" font-size="36" fill="rgba(255,255,255,0.85)">∫</text>
  <text x="48" y="95" font-family="Georgia, serif" font-style="italic" font-size="18" font-weight="bold" fill="rgba(255,255,255,0.9)">f(x) dx</text>
  <text x="24" y="140" font-family="monospace" font-size="13" fill="rgba(233,213,255,0.8)">lim(x→c) • dy/dx</text>
</svg>
