<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-mat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="55%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <marker id="arrow-vec" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fde047"/>
    </marker>
    <marker id="arrow-vec2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="400" height="180" fill="url(#bg-mat)"/>
  <!-- Kurung Siku Matriks 3x3 -->
  <path d="M 45 45 L 35 45 L 35 125 L 45 125" fill="none" stroke="#fff" stroke-width="2.5"/>
  <path d="M 145 45 L 155 45 L 155 125 L 145 125" fill="none" stroke="#fff" stroke-width="2.5"/>
  <!-- Elemen Matriks -->
  <text x="52" y="68" font-family="monospace" font-size="15" font-weight="bold" fill="#e0f2fe">a₁₁  a₁₂  a₁₃</text>
  <text x="52" y="92" font-family="monospace" font-size="15" font-weight="bold" fill="#7dd3fc">a₂₁  a₂₂  a₂₃</text>
  <text x="52" y="116" font-family="monospace" font-size="15" font-weight="bold" fill="#e0f2fe">a₃₁  a₃₂  a₃₃</text>
  <!-- Sistem Vektor 2D -->
  <line x1="210" y1="135" x2="365" y2="135" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="225" y1="30" x2="225" y2="145" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
  <line x1="225" y1="135" x2="310" y2="105" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow-vec2)"/>
  <line x1="225" y1="135" x2="265" y2="55" stroke="#7dd3fc" stroke-width="2.5" marker-end="url(#arrow-vec2)"/>
  <line x1="225" y1="135" x2="345" y2="35" stroke="#fde047" stroke-width="3" marker-end="url(#arrow-vec)"/>
  <line x1="310" y1="105" x2="345" y2="35" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="265" y1="55" x2="345" y2="35" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="350" y="34" font-family="Georgia, serif" font-style="italic" font-size="14" font-weight="bold" fill="#fde047">u + v</text>
</svg>
