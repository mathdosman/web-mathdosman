<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="900" viewBox="0 0 2100 900" role="img" aria-label="Statistika Bivariat dan UTBK HOTS - MATHDOSMAN">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c17" />
      <stop offset="45%" stop-color="#064e3b" />
      <stop offset="85%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>

    <linearGradient id="grad-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="stat-dots" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="1.5" fill="#34d399" fill-opacity="0.15" />
    </pattern>
  </defs>

  <rect width="2100" height="900" fill="url(#bg5)" />
  <rect width="2100" height="900" fill="url(#stat-dots)" />

  <!-- Ambient Light Orbs -->
  <circle cx="1600" cy="250" r="320" fill="#059669" fill-opacity="0.3" filter="url(#glow-emerald)" />
  <circle cx="320" cy="650" r="280" fill="#0284c7" fill-opacity="0.25" filter="url(#glow-emerald)" />

  <!-- LEFT COLUMN: Typography -->
  <g transform="translate(140, 150)">
    <rect x="0" y="0" width="460" height="54" rx="27" fill="#063228" stroke="#34d399" stroke-width="2" />
    <circle cx="28" cy="27" r="9" fill="#34d399" />
    <text x="50" y="35" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#d1fae5" letter-spacing="1.5">📊 STATISTIKA &amp; PENALARAN UTBK</text>

    <!-- Main Title -->
    <text x="0" y="160" font-family="system-ui, sans-serif" font-size="90" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Statistika &amp; <tspan fill="#34d399">HOTS</tspan>
    </text>

    <!-- Slogan -->
    <text x="0" y="240" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="url(#grad-emerald)">
      Regresi Bivariat, Peluang &amp; Penalaran Kuantitatif
    </text>

    <!-- Description -->
    <text x="0" y="320" font-family="system-ui, sans-serif" font-size="26" font-weight="400" fill="#cbd5e1">
      Kuasai kurikulum Merdeka terbaru materi data bivariat, diagram pencar, serta latihan soal penalaran SNBT.
    </text>

    <!-- Sub-topic Pills -->
    <g transform="translate(0, 370)">
      <g>
        <rect x="0" y="0" width="280" height="66" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" />
        <text x="140" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#f0fdf4" text-anchor="middle">Diagram Pencar &amp; Tren</text>
      </g>
      <g transform="translate(300, 0)">
        <rect x="0" y="0" width="310" height="66" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="1.5" />
        <text x="155" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#f0fdf4" text-anchor="middle">Regresi Linear ŷ = a + bx</text>
      </g>
      <g transform="translate(630, 0)">
        <rect x="0" y="0" width="280" height="66" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
        <text x="140" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#f0fdf4" text-anchor="middle">Penalaran HOTS SNBT</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Modern Scatter Plot Visual Card -->
  <g transform="translate(1320, 120)">
    <rect x="0" y="0" width="640" height="640" rx="36" fill="#042a20" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.3" stroke-width="2" />

    <!-- Card Header -->
    <rect x="36" y="36" width="568" height="50" rx="16" fill="#021c15" fill-opacity="0.9" />
    <circle cx="66" cy="61" r="7" fill="#34d399" />
    <text x="90" y="68" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#a7f3d0">Bivariate Regression • Trendline &amp; Correlation</text>

    <!-- Visual Scatter Plot -->
    <g transform="translate(70, 130)">
      <!-- Axes -->
      <line x1="30" y1="280" x2="490" y2="280" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
      <line x1="30" y1="280" x2="30" y2="30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

      <!-- Glowing Regression Line -->
      <line x1="40" y1="250" x2="480" y2="50" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />

      <!-- Scatter Dots with Soft Glow -->
      <circle cx="80" cy="225" r="9" fill="#34d399" />
      <circle cx="120" cy="235" r="9" fill="#2dd4bf" />
      <circle cx="160" cy="180" r="9" fill="#34d399" />
      <circle cx="210" cy="190" r="9" fill="#6ee7b7" />
      <circle cx="250" cy="140" r="9" fill="#38bdf8" />
      <circle cx="300" cy="155" r="9" fill="#34d399" />
      <circle cx="340" cy="100" r="9" fill="#2dd4bf" />
      <circle cx="390" cy="115" r="9" fill="#6ee7b7" />
      <circle cx="430" cy="60" r="9" fill="#38bdf8" />
      <circle cx="460" cy="75" r="9" fill="#34d399" />

      <!-- Axis Labels -->
      <text x="495" y="285" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#cbd5e1">x</text>
      <text x="25" y="20" font-family="Georgia, serif" font-size="20" font-style="italic" fill="#cbd5e1">y</text>
    </g>

    <!-- Regression Formula Card -->
    <g transform="translate(40, 460)">
      <rect x="0" y="0" width="560" height="84" rx="20" fill="#063228" fill-opacity="0.9" stroke="#34d399" stroke-opacity="0.4" stroke-width="2" />
      <text x="280" y="52" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#ffffff" text-anchor="middle">
        ŷ = a + bx  |  Korelasi Positif Kuat (r &gt; 0.9)
      </text>
    </g>

    <!-- Bottom Stat Strip -->
    <g transform="translate(40, 565)">
      <rect x="0" y="0" width="560" height="50" rx="16" fill="#064e3b" fill-opacity="0.4" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.5" />
      <text x="280" y="32" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#6ee7b7" text-anchor="middle">
        🚀 Siap Hadapi Soal Numerasi &amp; Penalaran Matematika
      </text>
    </g>
  </g>
</svg>
