<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="900" viewBox="0 0 2100 900" role="img" aria-label="Aljabar dan Matriks - MATHDOSMAN">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021526" />
      <stop offset="45%" stop-color="#032541" />
      <stop offset="85%" stop-color="#0d3b66" />
      <stop offset="100%" stop-color="#05445e" />
    </linearGradient>

    <linearGradient id="grad-teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="card-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="matrix-grid" width="70" height="70" patternUnits="userSpaceOnUse">
      <path d="M 70 0 L 0 0 0 70" fill="none" stroke="#2dd4bf" stroke-opacity="0.08" stroke-width="1.5" />
    </pattern>
  </defs>

  <rect width="2100" height="900" fill="url(#bg2)" />
  <rect width="2100" height="900" fill="url(#matrix-grid)" />

  <!-- Ambient Light Orbs -->
  <circle cx="1650" cy="280" r="300" fill="#0d9488" fill-opacity="0.25" filter="url(#glow-teal)" />
  <circle cx="300" cy="700" r="280" fill="#2563eb" fill-opacity="0.2" filter="url(#glow-teal)" />

  <!-- LEFT COLUMN: Typography -->
  <g transform="translate(140, 150)">
    <!-- Badge -->
    <rect x="0" y="0" width="380" height="54" rx="27" fill="#0f2942" stroke="#2dd4bf" stroke-width="2" />
    <circle cx="28" cy="27" r="9" fill="#2dd4bf" />
    <text x="50" y="35" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#ccfbf1" letter-spacing="1.5">📐 ALJABAR &amp; SISTEM MATRIKS</text>

    <!-- Main Title -->
    <text x="0" y="160" font-family="system-ui, sans-serif" font-size="90" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Matriks &amp; <tspan fill="#2dd4bf">Vektor</tspan>
    </text>

    <!-- Slogan -->
    <text x="0" y="240" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="url(#grad-teal)">
      Operasi Baris, Determinan, Invers &amp; SPLTV
    </text>

    <!-- Description -->
    <text x="0" y="320" font-family="system-ui, sans-serif" font-size="26" font-weight="400" fill="#94a3b8">
      Pahami konsep matriks ordo 2x2 dan 3x3, sifat determinan, serta penerapan pada sistem aljabar.
    </text>

    <!-- Sub-topic Pills -->
    <g transform="translate(0, 370)">
      <g>
        <rect x="0" y="0" width="290" height="66" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1.5" />
        <text x="145" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#f0fdfa" text-anchor="middle">Invers Matriks 2×2</text>
      </g>
      <g transform="translate(310, 0)">
        <rect x="0" y="0" width="290" height="66" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
        <text x="145" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#f0fdfa" text-anchor="middle">Metode Sarrus &amp; Kofaktor</text>
      </g>
      <g transform="translate(620, 0)">
        <rect x="0" y="0" width="290" height="66" rx="20" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
        <text x="145" y="42" font-family="system-ui, sans-serif" font-size="22" font-weight="600" fill="#f0fdfa" text-anchor="middle">Penyelesaian SPLTV</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Elegant Matrix Visual Card -->
  <g transform="translate(1320, 120)">
    <rect x="0" y="0" width="640" height="640" rx="36" fill="url(#card-grad2)" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="2" />

    <!-- Card Header -->
    <rect x="36" y="36" width="568" height="50" rx="16" fill="#021a2e" fill-opacity="0.8" />
    <circle cx="66" cy="61" r="7" fill="#2dd4bf" />
    <text x="90" y="68" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#a7f3d0">Matrix Inversion Formula • A⁻¹ = (1/det A) · adj(A)</text>

    <!-- Visual Matrix Representation -->
    <g transform="translate(70, 140)">
      <!-- Left Matrix A -->
      <g>
        <!-- Big Brackets -->
        <path d="M 30,30 L 10,30 L 10,210 L 30,210" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" />
        <path d="M 170,30 L 190,30 L 190,210 L 170,210" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-linecap="round" />
        <!-- Elements -->
        <text x="60" y="95" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#ffffff">a</text>
        <text x="140" y="95" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#38bdf8">b</text>
        <text x="60" y="175" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#818cf8">c</text>
        <text x="140" y="175" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#ffffff">d</text>
      </g>

      <!-- Multiplier Symbol -->
      <text x="215" y="135" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#94a3b8">×</text>

      <!-- Right Column Vector X -->
      <g transform="translate(235, 0)">
        <path d="M 25,30 L 10,30 L 10,210 L 25,210" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
        <path d="M 85,30 L 100,30 L 100,210 L 85,210" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
        <text x="55" y="95" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#2dd4bf" text-anchor="middle">x</text>
        <text x="55" y="175" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#2dd4bf" text-anchor="middle">y</text>
      </g>

      <!-- Equals -->
      <text x="360" y="135" font-family="system-ui, sans-serif" font-size="38" font-weight="900" fill="#94a3b8">=</text>

      <!-- Result Vector B -->
      <g transform="translate(380, 0)">
        <path d="M 25,30 L 10,30 L 10,210 L 25,210" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />
        <path d="M 95,30 L 110,30 L 110,210 L 95,210" fill="none" stroke="#818cf8" stroke-width="5" stroke-linecap="round" />
        <text x="60" y="95" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">x'</text>
        <text x="60" y="175" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">y'</text>
      </g>
    </g>

    <!-- Formula Highlighting Card -->
    <g transform="translate(40, 410)">
      <rect x="0" y="0" width="560" height="96" rx="20" fill="#022c43" fill-opacity="0.9" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="2" />
      <text x="30" y="58" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#2dd4bf">
        det(A) = ad - bc &amp;ne; 0
      </text>
      <text x="350" y="58" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">
        (Memiliki Invers)
      </text>
    </g>

    <!-- Bottom Stat Strip -->
    <g transform="translate(40, 530)">
      <rect x="0" y="0" width="560" height="64" rx="18" fill="#134e4a" fill-opacity="0.4" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1.5" />
      <text x="280" y="40" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#5eead4" text-anchor="middle">
        💡 Tersedia 15+ Paket Latihan Matriks SMA Kelas 11
      </text>
    </g>
  </g>
</svg>
