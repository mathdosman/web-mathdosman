<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gelap -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Bangun 1: Pilar Kiri (Biru Royal 3D) -->
    <linearGradient id="blockLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Bangun 2: Lipatan Diagonal Atas (Cyan Terang Terkena Cahaya 3D) -->
    <linearGradient id="blockTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Bangun 3: Pilar Kanan & Puncak (Biru Dalam 3D) -->
    <linearGradient id="blockRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="45%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Bayangan lipatan 3D -->
    <linearGradient id="foldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Gelap Rounded -->
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#darkBg)"/>
  <rect x="6" y="6" width="500" height="500" rx="90" stroke="#1e293b" stroke-width="2"/>

  <!-- Bangun 1: Pilar Kiri (dengan sisi samping 3D halus) -->
  <polygon points="74,182 184,182 184,410 74,410" fill="url(#blockLeft)"/>
  <polygon points="184,182 198,196 198,422 184,410" fill="#0f2557"/>

  <!-- Bangun 3: Pilar Kanan & Puncak 45° (dengan sisi bawah/kanan 3D halus) -->
  <polygon points="338,182 446,74 446,410 338,410" fill="url(#blockRight)"/>
  <polygon points="446,74 458,86 458,422 446,410" fill="#091534"/>

  <!-- Bayangan jatuh di bawah lipatan atas -->
  <polygon points="74,182 184,182 260,276 338,182 260,260" fill="url(#foldShadow)"/>

  <!-- Bangun 2: Bidang Lipatan Diagonal Atas (Highlight 3D) -->
  <polygon points="74,74 230,74 338,182 260,260" fill="url(#blockTop)"/>
  <!-- Garis tepi cahaya tipis agar kesan bidang 3D makin tegas -->
  <polyline points="74,74 230,74 338,182" stroke="#bae6fd" stroke-width="2.5" stroke-opacity="0.7" fill="none"/>
</svg>
